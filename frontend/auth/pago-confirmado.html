<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>¡Listo! · LuCes Digital</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1F2937;
        }

        .caja {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .icono {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #111827;
        }

        p {
            color: #6B7280;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .info-tienda {
            background: #F3F4F6;
            padding: 16px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 14px;
            color: #1F2937;
        }

        .info-tienda strong {
            display: block;
            color: #111827;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .boton {
            display: inline-block;
            padding: 12px 32px;
            background: #7C3AED;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .boton:hover {
            background: #6D28D9;
        }

        .detalles {
            font-size: 12px;
            color: #9CA3AF;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #E5E7EB;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #E5E7EB;
            border-top-color: #7C3AED;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="caja">
        <div class="icono" id="icono">✓</div>
        <h1 id="titulo">¡Tu tienda está lista!</h1>
        <p id="mensaje">Tu suscripción se activó correctamente</p>

        <div class="info-tienda" id="info-tienda">
            <strong id="nombre-tienda">Cargando...</strong>
            <div id="url-tienda"></div>
        </div>

        <p style="font-size: 13px; color: #6B7280;">
            Accedé a tu panel de administración con tu email y contraseña
        </p>

        <button class="boton" onclick="irAlPanel()">Ir al panel</button>

        <div class="detalles">
            <p>Se te ha enviado un email de confirmación con los detalles de tu tienda.</p>
        </div>
    </div>

    <script>
        async function cargarDatos() {
            const params = new URLSearchParams(window.location.search);
            const tenant = params.get("tenant");
            const status = params.get("status");

            if (status === "failure") {
                document.getElementById("icono").textContent = "✗";
                document.getElementById("titulo").textContent = "Algo salió mal";
                document.getElementById("mensaje").textContent =
                    "El pago no se procesó. Intenta de nuevo.";
                document.getElementById("info-tienda").style.display = "none";
                return;
            }

            if (tenant) {
                try {
                    // Llamar a la API para confirmar el pago
                    const params_pago = new URLSearchParams(window.location.search);
                    const payment_id = params_pago.get("payment_id");
                    const preference_id = params_pago.get("preference_id");

                    if (payment_id) {
                        await fetch("/api/auth/confirmar-pago", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                payment_id,
                                preference_id,
                                tenant_slug: tenant
                            })
                        });
                    }

                    document.getElementById("nombre-tienda").textContent = tenant;
                    document.getElementById("url-tienda").textContent =
                        `${tenant}.luces-digital.com`;
                } catch (err) {
                    console.error("Error:", err);
                }
            }
        }

        function irAlPanel() {
            window.location.href = "/login";
        }

        cargarDatos();
    </script>
</body>
</html>
