<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Categorías · Panel</title>

    <link rel="stylesheet" href="/shared/css/tokens.css">
    <link rel="stylesheet" href="/shared/css/base.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-seccion="categorias" data-titulo="Categorías">

    <main class="contenido" data-contenido>

        <div class="pagina">
            <div class="pagina__texto">
                <h2 class="pagina__titulo">Categorías</h2>
                <p class="pagina__ayuda">
                    Sirven para agrupar los productos en el menú de tu tienda.
                    El orden de esta lista es el que ve tu cliente.
                </p>
            </div>
            <div class="pagina__acciones">
                <button class="boton boton--primario" type="button" id="botonNueva">
                    Nueva categoría
                </button>
            </div>
        </div>

        <div class="tabla-marco">
            <div id="lista">
                <div class="cargando"><span class="giro"></span></div>
            </div>
        </div>

    </main>

    <script src="/shared/js/sesion.js"></script>
    <script src="/shared/js/api.js"></script>
    <script src="/shared/js/notificaciones.js"></script>
    <script src="js/comunes.js"></script>
    <script src="js/cajon.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/categorias.js"></script>

</body>
</html>
